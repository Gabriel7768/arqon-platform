# Pre-commit hooks for the ARQON Platform.
# Primary control: block secrets from being committed locally, before any push.
# This is mandatory because the repo is private and GitHub-native push protection
# requires GitHub Advanced Security (not available). See docs/audit (secret audit).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets (gitleaks)
